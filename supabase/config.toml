# Config CLI Supabase (npx supabase ...). Voir supabase/schema.sql et
# supabase/functions.sql pour le reste du backend (pas géré par des
# migrations CLI, cf. gotcha "Supabase setup" — collé manuellement dans
# l'éditeur SQL du dashboard ou via `supabase db query --linked`).

[functions.revenuecat-webhook]
# RevenueCat envoie son propre secret partagé dans l'en-tête Authorization
# (vérifié à la main dans index.ts), pas un JWT Supabase — la vérification
# JWT par défaut de la passerelle rejette sinon la requête avant même
# d'atteindre le code de la fonction (observé : 401
# UNAUTHORIZED_INVALID_JWT_FORMAT).
verify_jwt = false

[functions.map-tile-proxy]
# Proxy de tuiles pour les fonds de carte nationaux à clé API (Suède,
# Finlande). Un fond de carte doit rester affichable sans session
# utilisateur (contrainte « zone blanche ») : verify_jwt = false, comme
# revenuecat-webhook. Les clés Lantmäteriet / MML restent des secrets
# serveur, injectées dans la fonction, jamais exposées au client.
verify_jwt = false

[functions.assistant-token]
# JWT Supabase standard (attaché automatiquement par supabase_flutter) :
# verify_jwt reste à sa valeur par défaut (true).
static_files = ["./functions/assistant-token/manuel_utilisateur.md"]
