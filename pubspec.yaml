name: meshiker
description: "Application de navigation pour la randonnée"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.1.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.2
  supabase_flutter: ^2.10.1 # linkIdentityWithIdToken() introduit en 2.10.1
  # --- BLOC LOCALISATION (DERNIÈRES VERSIONS) ---
  geolocator: ^14.0.2
  permission_handler: ^12.0.3
  flutter_tts: ^4.2.5
  # --- BLOC CARTE (VERSIONS STABLES COMPATIBLES) ---
  flutter_map: ^7.0.2             # Limite imposée par vector_map_tiles
  latlong2: ^0.9.1               # Limite imposée par vector_map_tiles
  # -----------------------------------------------
  uuid: ^4.6.0
  intl: ^0.20.3
  xml: ^7.0.1
  mbtiles: ^0.4.2
  vector_map_tiles: ^8.0.0
  vector_map_tiles_mbtiles: ^1.2.0
  vector_tile_renderer: ^5.2.1
  flutter_compass: ^0.8.1
  shared_preferences: ^2.2.3
  provider: ^6.1.1
  flutter_colorpicker: ^1.1.0
  image_picker: ^1.0.7
  # Observateur de pellicule pour la détection multi-photos Android
  # (spec-photos-geolocalisees.md §3.3).
  photo_manager: ^3.12.0
  http: ^1.6.0
  file_picker: ^8.0.1
  pedometer: ^4.0.0
  gnss_diagnostics: ^0.1.0
  solar_calculator: ^1.0.1
  purchases_flutter: ^10.4.1
  connectivity_plus: ^7.3.0
  purchases_ui_flutter: ^10.4.1
  google_sign_in: ^7.2.0

  path: any
  collection: any
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.3
  flutter_sound: ^9.30.0
  sentry_flutter: 9.28.0
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - docs/manuel_utilisateur.md

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: meshiker
  org: rosaweb
